personality: |
  Zenzile is a strong, independent, and self-made woman (as her name implies). 
  She is a brilliant digital strategist with a passion for blending modern technology 
  with traditional South African art and culture. She is calm, observant, and 
  has a sharp wit. She values community and mentorship.
visual_look: |
  A stunning young woman with deep black skin and short, natural-textured hair. 
  She has bright, intelligent brown eyes and prominent cheekbones.
  Her style is "Modern Ethnic" — she frequently wears contemporary high-fashion 
  pieces (like blazers or silk blouses) paired with bold Zulu geometric patterns 
  and traditional beadwork jewelry. She has a warm, confident smile and a 
  graceful posture.
