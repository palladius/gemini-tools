# Official Gemini & GenAI Public Model Catalog
# Single source of truth for release dates and concise (<=280 chars) short descriptions.
# Used by bin/list-gemini-models.py and the gemini-model-selector skill.
# Docs: https://ai.google.dev/gemini-api/docs/changelog | https://ai.google.dev/gemini-api/docs/models

models:
  gemini-4-argon:
    release_date: "2026-10-13"
    category: "flagship-reasoning"
    short_description: "Flagship 1M-ctx reasoning, coding & research powerhouse (65k out). Replaces 3.1-pro for complex architecture, STEM, and multi-step agentic workflows."

  gemini-nano-banana-2.1:
    release_date: "2026-10-06"
    category: "image-generation"
    short_description: "Nano Banana 2.1: flagship high-efficiency 1K/2K/4K image generator & conversational editor supporting multi-image fusion with up to 14 reference images."

  gemini-3.8-flash-tts:
    release_date: "2026-09-22"
    category: "audio-tts"
    short_description: "Expressive studio TTS: Voice Design from text prompts, Voice Replication, dual-speaker podcasts, backchanneling (|mhm|, |yeah|) & vocal bursts (<laugh>, <gasp>)."

  gemini-3.8-flash-lite-tts:
    release_date: "2026-09-22"
    category: "audio-tts"
    short_description: "Ultra-fast, low-cost TTS for high-volume voice agents, article reading, IVR, global dubbing, and accessibility screen readers."

  antigravity-preview-09-2026:
    release_date: "2026-09-17"
    category: "managed-agent"
    short_description: "Managed Antigravity Agent with sandboxed Linux code execution, file management & web access. Call via client.interactions.create(environment='remote')."

  gemini-3.8-live-extended-thinking:
    release_date: "2026-09-15"
    category: "live-audio"
    short_description: "'Thinker-Talker' Live API (bidiGenerateContent) model for real-time voice conversations requiring deep reasoning and multi-step tool execution."

  gemini-3.8-live:
    release_date: "2026-09-15"
    category: "live-audio"
    short_description: "Low-latency real-time bidirectional voice & video conversation model via the Gemini Live API (bidiGenerateContent)."

  lyria-3.5:
    release_date: "2026-09-03"
    category: "music-generation"
    short_description: "Lyria 3.5 music & vocals generator: creates 30s clips (lyria-3-clip-preview) or full 2-3 min songs with custom lyrics, vocals & genre control (lyria-3-pro-preview)."

  gemini-3.8-flash:
    release_date: "2026-09-02"
    category: "fast-multimodal"
    short_description: "Default 1M-ctx fast workhorse (65k out) balancing thinking, multimodal understanding, and low-latency agentic tool calling."

  gemini-omni-1.1-flash:
    release_date: "2026-08-27"
    category: "video-generation"
    short_description: "Omni Flash video+audio generator & editor: text/image-to-video, first/last frame transitions, object add/remove, AR zoom & 40s extensions via client.interactions API."

  gemini-3.5-transcribe:
    release_date: "2026-08-26"
    category: "audio-stt"
    short_description: "Dedicated high-speed Speech-to-Text (ASR) model for pre-recorded audio with smart formatting and verbatim transcription modes."

  gemini-3.5-transcribe-live:
    release_date: "2026-08-26"
    category: "audio-stt"
    short_description: "Real-time streaming Speech-to-Text and live speech translation model via the Live API."

  gemini-3.7-flash:
    release_date: "2026-08-13"
    category: "fast-multimodal"
    short_description: "August 2026 1M-ctx Flash release; superseded by gemini-3.8-flash for new agentic and multimodal workloads."

  gemini-robotics-er-2-preview:
    release_date: "2026-07-30"
    category: "robotics"
    short_description: "Embodied Reasoning 2.0 model for physical robotics: 3D spatial grounding, trajectory planning, and manipulation task decomposition."

  gemini-robotics-er-2-streaming-preview:
    release_date: "2026-07-30"
    category: "robotics"
    short_description: "Low-latency streaming variant of Gemini Robotics ER 2.0 for continuous closed-loop robot control."

  gemini-3.6-flash:
    release_date: "2026-07-21"
    category: "fast-multimodal"
    short_description: "July 2026 1M-ctx Flash release; upgrade to gemini-3.8-flash for improved reasoning and tool use."

  gemini-3.5-flash-lite:
    release_date: "2026-07-21"
    category: "high-throughput"
    short_description: "Fastest, lowest-cost 1M-ctx 3.5 model engineered for high-throughput batch classification, extraction, and routing."

  gemini-omni-flash-preview:
    release_date: "2026-06-30"
    category: "video-generation"
    short_description: "Early preview of Omni Flash video generation & editing; upgrade to GA gemini-omni-1.1-flash."

  gemini-3.1-flash-lite-image:
    release_date: "2026-06-30"
    category: "image-generation"
    short_description: "Nano Banana 2 Lite: ultra-fast, cost-efficient general image generation and conversational editing (65k in / 32k out)."

